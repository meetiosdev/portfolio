<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error Analytics Dashboard | Swarajmeet</title>
  <link rel="icon" href="../../assets/images/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/admin.css">
  <style>
    /* Glassmorphic overrides matching root portfolio aesthetic */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 12, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 255, 255, 0.16);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 900ms linear infinite;
    }
    .error-card-bento {
      border: 1px solid rgba(255, 159, 181, 0.22) !important;
      background: linear-gradient(145deg, rgba(255, 159, 181, 0.05), rgba(10, 14, 28, 0.85)) !important;
      border-radius: 20px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 24px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
      transition: all 0.25s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .error-card-bento:hover {
      border-color: rgba(255, 159, 181, 0.44) !important;
      box-shadow: 0 20px 60px rgba(255, 159, 181, 0.08);
      transform: translateY(-2px);
    }
    .error-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
    }
    .error-badge-pill {
      background: rgba(255, 159, 181, 0.12);
      border: 1px solid rgba(255, 159, 181, 0.3);
      color: var(--rose);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .error-meta-group {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .error-reason-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.3;
      word-break: break-word;
    }
    .error-source-loc {
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid var(--line);
      padding: 10px 14px;
      border-radius: 10px;
      font-family: Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      color: #cbd5e1;
      word-break: break-all;
    }
    .timeline-journey-box {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
    }
    .timeline-title-bar {
      margin-bottom: 16px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
  </style>
</head>
<body>

  <!-- Loading State -->
  <div id="loading-overlay" class="overlay">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
      <div class="spinner"></div>
      <p style="color: var(--muted); font-weight: 600;">Syncing Error Analytics...</p>
    </div>
  </div>

  <div id="dashboard-container">
    <header class="topbar glass-card" style="margin: 20px auto; max-width: 900px; width: 100%;">
      <div>
        <p class="eyebrow" style="color: var(--rose);">System Diagnostics</p>
        <h1 id="dashboard-title" style="margin-bottom: 0; font-size: 28px;">Error Logs</h1>
      </div>
      <a href="../index.html" class="ghost-button" style="text-decoration: none; color: inherit; display: inline-flex; align-items: center; gap: 6px;">
        ← Back to Dashboard
      </a>
    </header>

    <main class="app-shell" style="padding-top: 0;">
      <!-- Error logs bento listing -->
      <section id="errors-section" style="max-width: 900px; margin: 0 auto; width: 100%;">
        <div id="errors-container">
          <!-- Dynamically populated -->
        </div>

        <div id="empty-state" class="empty-state glass-card hidden">
          <span style="font-size: 48px;">🛡️</span>
          <h2>System healthy. No errors logged!</h2>
          <p>Exception listeners are active. When a visitor encounters a JavaScript exception or unhandled promise rejection, it will appear here in high-fidelity detail.</p>
        </div>
      </section>
    </main>
  </div>

  <!-- JS Module -->
  <script src="js/errors.js"></script>
</body>
</html>
